# ==============================================================================
# WEHOSTHERE — Configuração de Gateway HAProxy (IMAP & SMTP SNI Passthrough)
# ==============================================================================
# Para servidores Linux gratuitos (ex: Oracle Cloud Always Free, Ubuntu 22.04/24.04)

global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# IMAP Seguro (Porta 993)
frontend imap_in
    bind *:993
    mode tcp
    default_backend imap_migadu

backend imap_migadu
    mode tcp
    server migadu imap.migadu.com:993 check ssl verify none

# SMTP Seguro (Porta 465)
frontend smtp_in
    bind *:465
    mode tcp
    default_backend smtp_migadu

backend smtp_migadu
    mode tcp
    server migadu smtp.migadu.com:465 check ssl verify none
