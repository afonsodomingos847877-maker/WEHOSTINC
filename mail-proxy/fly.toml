app = "wehosthere-mail-proxy"
primary_region = "jnb" # Joanesburgo (baixa latência para Moçambique)

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 993
  protocol = "tcp"
  [[services.ports]]
    port = 993

[[services]]
  internal_port = 465
  protocol = "tcp"
  [[services.ports]]
    port = 465

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

